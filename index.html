<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F0E4">
<meta name="description" content="Inglés para hablar en 24 semanas: tarjetas, verbos, voz y plan diario.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Amauta">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Amauta Idioma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: una columna de estudio (máx. 720px) con barra de pestañas fija abajo, como app de bolsillo. Familia visual de las apps de Anggelo: fondo crema, sello arriba y abajo. */
:root{
  --bg:#F6F0E4; --surface:#FFFBF3; --ink:#1F1B2E; --muted:#6B6378; --line:#E2D8C6;
  --accent:#B4362A; --accent-ink:#FFFFFF; --teal:#1F6E6A; --gold:#C98A1B; --soft:#EFE5D2;
  --ok:#2F7D46; --warn:#B9771A;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17141F; --surface:#211D2B; --ink:#F2EBDD; --muted:#A79FB3; --line:#36304A;
  --accent:#E0654F; --accent-ink:#1A0F0C; --teal:#5BB8B0; --gold:#E2AE4C; --soft:#2A2536;
  --ok:#6CC28A; --warn:#E2AE4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141F; --surface:#211D2B; --ink:#F2EBDD; --muted:#A79FB3; --line:#36304A;
  --accent:#E0654F; --accent-ink:#1A0F0C; --teal:#5BB8B0; --gold:#E2AE4C; --soft:#2A2536;
  --ok:#6CC28A; --warn:#E2AE4C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}

/* Cabecera */
header.top{display:flex;align-items:center;gap:14px;padding-block:20px 12px}
.sello{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em}
.sello img{width:100%;height:100%;object-fit:cover}
.brand{min-width:0}
.brand h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:14px}
/* franja tejida: patrón escalonado inspirado en la chakana */
.franja{height:10px;margin-block:6px 18px;border-radius:2px;
  background:
   linear-gradient(135deg,var(--accent) 25%,transparent 25%) 0 0/20px 10px,
   linear-gradient(225deg,var(--accent) 25%,transparent 25%) 0 0/20px 10px,
   var(--gold);opacity:.9}

/* Navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .row{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button[aria-current="page"] .dot{background:var(--accent)}
nav.tabs .dot{width:5px;height:5px;border-radius:50%;background:transparent}

section.view{display:grid;gap:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Botones */
.btn{text-decoration:none;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--soft);border-radius:999px;width:36px;height:36px;display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

/* HOY */
.hoy-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.hoy-head h2{font-size:30px;font-weight:800}
.semana{text-align:right}
.semana b{font-family:var(--display);font-size:34px;line-height:1;display:block}
.barra{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--teal);border-radius:99px}
.metas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meta{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:6px;text-align:left}
.meta{min-width:0}
.meta .t{display:flex;justify-content:space-between;align-items:center;gap:4px 8px;font-weight:700;flex-wrap:wrap}
.meta .n{font-family:var(--display);font-size:22px}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.meta .chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.meta.done .chip{background:var(--ok);color:var(--bg)}
.racha{display:flex;gap:6px;flex-wrap:wrap}
.racha span{width:22px;height:22px;border-radius:6px;background:var(--soft);border:1px solid var(--line)}
.racha span.on{background:var(--gold);border-color:var(--gold)}
.racha span.full{background:var(--accent);border-color:var(--accent)}
.reto-frase{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding-block:8px;border-top:1px dashed var(--line)}
.reto-frase:first-of-type{border-top:0}
.en{font-weight:700}
.es{color:var(--muted);font-size:15px}

/* HABLAR */
.escenas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.escena{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:grid;gap:4px}
.escena b{font-family:var(--display);font-size:17px}
.escena span{font-size:13px;color:var(--muted)}
.escena[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chat{display:grid;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:14px;display:grid;gap:6px;min-width:0}
.msg.tutor{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.yo{background:var(--ink);color:var(--bg);justify-self:end;border-top-right-radius:4px}
.msg .linea{display:flex;gap:8px;align-items:flex-start}
.msg .linea .en{flex:1;min-width:0}
.corr{border-left:3px solid var(--warn);padding:6px 10px;background:var(--soft);border-radius:6px;font-size:15px}
.corr.bien{border-left-color:var(--ok)}
.natural{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.natural .en{color:var(--teal)}
.opciones{display:flex;flex-wrap:wrap;gap:6px}
.opcion{border:1px dashed var(--teal);background:transparent;color:var(--teal);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;text-align:left}
.compose{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.compose textarea{width:100%;min-height:52px;max-height:160px;resize:vertical;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.typing{color:var(--muted);font-style:italic}
.tip{font-size:14px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}

/* TARJETAS */
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:240px;padding:24px 20px;display:grid;place-items:center;text-align:center;gap:10px;position:relative}
.flash .cat{position:absolute;top:12px;left:16px}
.flash .big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.2}
.flash .sub{font-size:18px;color:var(--muted)}
.califs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.califs .btn{padding:10px 6px;font-size:14px;flex-direction:column;gap:0;border-radius:12px}
.califs .btn small{font-weight:400;font-size:11px;opacity:.8}
.cajas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center}
.cajas div{background:var(--soft);border-radius:8px;padding:6px 2px}
.cajas b{font-family:var(--display);font-size:18px;display:block}
.cajas small{font-size:11px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--soft);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* VOZ */
.shadow-frase{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.25}
.reps{display:flex;gap:8px}
.reps span{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.reps span.on{background:var(--teal);border-color:var(--teal);color:var(--bg)}
.prompt-box{font-size:14px;background:var(--soft);border-radius:10px;padding:12px;white-space:pre-wrap;user-select:all;overflow-wrap:anywhere}

/* PLAN */
.fase{display:grid;grid-template-columns:72px 1fr;gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.fase:first-of-type{border-top:0}
.fase .sem{font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.fase.actual .sem{color:var(--accent)}
.fase h3{font-size:19px;margin-bottom:4px}
.fase ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.rutina{display:grid;gap:8px}
.rutina div{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline}
.rutina b{font-family:var(--display);font-variant-numeric:tabular-nums}

/* VERBOS */
.drill-sujeto{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.1}
.drill-meta{display:flex;flex-wrap:wrap;gap:6px}
.drill-meta .chip{font-size:12px}
.chip.acc{background:var(--accent);color:var(--accent-ink)}
.chip.tl{background:var(--teal);color:var(--bg)}
.resp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-size:18px}
.resultado{border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--soft)}
.resultado.ok{border-left:4px solid var(--ok)}
.resultado.mal{border-left:4px solid var(--accent)}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggle{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.toggle[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:var(--bg)}
.tabla-wrap{overflow-x:auto}
table.vt{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
table.vt th,table.vt td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.vt th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
table.vt td.f{font-weight:700}
select.sel{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:16px;width:100%}
/* SELLO Y TEMAS */
.sello-img{height:76px;width:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.sello-img.pie{height:44px}
.temas-btn{margin-left:auto;width:42px;height:42px}
.temas-btn svg{width:20px;height:20px}
.temas-grupo{display:grid;gap:8px}
.temas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tema-op{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;text-align:left}
.tema-op[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.swatches{display:flex;flex:none}
.swatches i{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px}
.swatches i:first-child{margin-left:0}
footer.pie{display:flex;align-items:center;gap:12px;justify-content:center;padding-block:28px 8px;color:var(--muted);font-size:13px;text-align:center}
footer.pie .sello{width:34px;height:34px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:440px){.sello-img{height:64px}nav.tabs button{font-size:11px}.drill-sujeto{font-size:24px}.brand h1{font-size:24px}.hoy-head h2{font-size:24px}.flash .big{font-size:24px}.califs .btn{font-size:13px}}
@media (prefers-reduced-motion:no-preference){.flash{transition:transform .15s}.flash.flip{transform:scale(.98)}}

[hidden]{display:none!important}
/* TARJETAS: escribir y revisar */
.escribir{gap:8px}
.resp-t{font-size:17px;padding:12px}
.mini-sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.mini-sw input{width:18px;height:18px;accent-color:var(--teal);margin:0}
.rev{gap:10px}
.rev-bloque{display:grid;gap:4px;padding-top:8px;border-top:1px dashed var(--line)}
.rev-tit{font-weight:700}
.rev-linea{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:17px}
.w-ok{color:var(--ok);font-weight:700}
.w-mal{color:var(--accent);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.w-falta{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--soft);color:var(--ink);font-weight:700}
.califs-wrap{display:grid;gap:8px}
.califs .btn.sugerida{outline:3px solid var(--gold);outline-offset:2px}
/* MIS CLASES */
.lista-clases{display:grid;gap:8px}
.clase-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;color:inherit}
.clase-item:hover{border-color:var(--teal)}
.clase-item .ci-tit{font-family:var(--display);font-weight:700;font-size:17px;grid-column:1}
.clase-item .small{grid-column:1}
.clase-item .chip{grid-column:2;grid-row:1 / span 2;align-self:center}
.chip.chip-ok{background:var(--ok);color:var(--bg)}
.vacio{text-align:center;justify-items:center}
.cargando{display:flex;gap:12px;align-items:center}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);flex:none;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.clase-tit{font-size:30px;margin-top:4px}
.clase-resumen{margin:0;font-size:17px;color:var(--muted)}
.clase-sec{position:relative}
.clase-sec h3{font-size:20px;padding-right:40px}
.sec-num{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.musica{border-style:dashed;border-color:var(--gold)}
.error-item{display:grid;gap:3px;padding-top:10px;border-top:1px dashed var(--line)}
.error-item:first-of-type{border-top:0;padding-top:0}
.err-mal{color:var(--accent);font-weight:700;text-decoration:line-through}
.err-bien{color:var(--ok);font-weight:700;display:flex;gap:8px;align-items:center}
.ejercicio{gap:10px}
.ejercicio.ej-ok{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.ejercicio.ej-mal{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ej-num{width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:13px}
.ej-preg{font-size:18px;font-weight:700}
.resultado-clase{text-align:center;justify-items:center;border-color:var(--gold)}
.borrar{color:var(--muted);font-size:13px}
/* PREGUNTAR */
.top-acc{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.top-acc .temas-btn{margin-left:0}
.preg-btn{width:auto;padding-inline:12px;gap:6px;display:inline-flex;align-items:center;font-weight:700;font-size:14px;border-radius:999px}
.preg-btn.activo{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rapidas{display:flex;flex-wrap:wrap;gap:6px}
.preg-texto{white-space:pre-wrap}
.btn svg{width:16px;height:16px;flex:none}
#preg-chat .msg.tutor{max-width:100%}
.ej-preg .btn{white-space:nowrap}
.ej-preg{display:grid;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.preg-card{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px dashed var(--teal);background:var(--surface);border-radius:14px;padding:14px 16px;color:inherit}
.preg-card b{font-family:var(--display);font-size:18px;display:block}
@media (max-width:440px){.preg-btn span{display:none}.preg-btn{width:42px;padding:0;justify-content:center}}
/* AJUSTES Y AYUDAS DE LECTURA */
.ajustes{margin-bottom:18px;gap:14px}
.switches{display:grid}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:12px;border-top:1px solid var(--line);cursor:pointer}
.sw:first-child{border-top:0}
.sw > span{display:grid;gap:2px;min-width:0}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked{background:var(--teal)}
.sw input:checked::after{transform:translateX(20px)}
.ejemplo-ajustes{background:var(--soft);border-radius:12px;padding:12px}
.ing{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;min-width:0}
.ing-cuerpo{min-width:0;display:grid;gap:4px}
.ing .oir{display:flex;gap:6px}
.inter{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start}
.w{display:inline-grid;line-height:1.25;min-width:0}
.w b{font-weight:700;font-size:17px}
.w .pr{font-size:13px;color:var(--teal);font-style:italic}
.w .gl{font-size:12.5px;color:var(--muted);max-width:11em}
.en-line{font-weight:700;font-size:17px}
.pr-line{color:var(--teal);font-style:italic;font-size:14px}
.trad{color:var(--muted);font-size:15px;border-left:3px solid var(--line);padding-left:8px}
.ing.lg .w b,.ing.lg .en-line{font-family:var(--display);font-size:25px;line-height:1.2}
.ing.lg .w .pr{font-size:15px}.ing.lg .w .gl{font-size:14px}
.ing.lg .trad{font-size:17px}
.ing.sm .w b,.ing.sm .en-line{font-size:15px}
.ing.sm .w .pr{font-size:12px}.ing.sm .w .gl{font-size:11.5px}
.ing.sm .trad{font-size:14px}
.lista-frases{display:grid;gap:12px}
.lista-frases > .ing{padding-top:12px;border-top:1px dashed var(--line)}
.lista-frases > .ing:first-child{border-top:0;padding-top:0}
.msg.yo .w .gl,.msg.yo .w .pr,.msg.yo .pr-line,.msg.yo .trad{color:inherit;opacity:.75}
.opcion{border:1px dashed var(--teal);background:transparent;color:inherit;border-radius:12px;padding:8px 12px;text-align:left;width:100%}
.opciones{display:grid;gap:6px}
.natural{display:grid;gap:6px;background:var(--soft);border-radius:10px;padding:10px}
details.guia{background:var(--soft);border-radius:12px;padding:12px 14px}
details.guia summary{font-weight:700;cursor:pointer;list-style-position:inside}
details.guia ol{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.vista-cab{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.vista-cab h2{font-size:26px;margin-top:4px}
.fila-sb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.campo{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px}
.btn.ancho{width:100%;padding:14px}
.flash-cuerpo{display:grid;gap:12px;justify-items:center;width:100%;min-width:0}
.flash .ing{text-align:left;width:100%}
.flash .chip.cat{position:absolute;top:12px;left:16px}
.flash{padding-top:44px;scroll-margin-top:12px}
.big-es{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.2}
.califs{grid-template-columns:repeat(3,minmax(0,1fr))}
.califs .btn small{font-size:11.5px}
.niveles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.niveles div{background:var(--soft);border-radius:8px;padding:8px 2px}
.niveles b{font-family:var(--display);font-size:20px;display:block}
.niveles small{font-size:11.5px;color:var(--muted)}
.drill-frase{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.15}
.opciones-v{display:grid;gap:8px}
.opcion-v{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%;color:inherit}
.opcion-v:not(:disabled):hover{border-color:var(--teal)}
.opcion-v.correcta{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opcion-v.incorrecta{border-color:var(--accent);opacity:.75}
.opcion-v:disabled{cursor:default}
.formula{background:var(--soft);border-radius:8px;padding:8px 10px;font-weight:700;font-size:15px}
.tiempo-bloque{display:grid;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.tiempo-bloque:first-child{border-top:0;padding-top:0}
.tiempo-bloque h3{font-size:19px}
.ejemplo{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start}
.ejemplo .etq{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.lista-verbos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.verbo-item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;min-width:0}
.verbo-es{font-size:14px;color:var(--muted)}
@media (max-width:440px){.drill-frase{font-size:25px}.ing.lg .w b,.ing.lg .en-line{font-size:22px}.ejemplo{grid-template-columns:1fr;gap:4px}.califs .btn{font-size:13px}}
</style>
</head>

function clave(w){return String(w).toLowerCase().replace(/[‘’]/g,"'").replace(/^[^a-z0-9à-ÿ']+|[^a-z0-9à-ÿ']+$/g,"").replace(/^'+|'+$/g,"")}
function buscar(k,extra){
  if(!k) return null;
  if(extra&&extra[k]) return extra[k];
  if(DICC[k]) return {es:DICC[k][0],pr:DICC[k][1]};
  if(S.vocab[k]) return {es:S.vocab[k][0],pr:S.vocab[k][1]};
  return null;
}
function mapaExtra(palabras){ // [["word","es","pr"],...] → {key:{es,pr}}
  const m={}; if(!Array.isArray(palabras)) return m;
  for(const p of palabras){ if(!Array.isArray(p)) continue; const k=clave(p[0]); if(k) m[k]={es:String(p[1]||""),pr:String(p[2]||"")}; }
  return m;
}
function aprenderPalabras(palabras){
  if(!Array.isArray(palabras)) return;
  for(const p of palabras){ if(!Array.isArray(p)) continue; const k=clave(p[0]); if(!k||DICC[k]) continue; S.vocab[k]=[String(p[1]||""),String(p[2]||"")]; }

}
function fichas(texto,palabras){
  const extra=mapaExtra(palabras);
  return String(texto||"").split(/\s+/).filter(Boolean).map(trozo=>{
    const k=clave(trozo); let r=buscar(k,extra);
    if(!r&&k.includes("-")){ const ps=k.split("-").map(x=>buscar(x,extra)); if(ps.every(Boolean)) r={es:ps.map(p=>p.es).join("-"),pr:ps.map(p=>p.pr).join("-")}; }
    return {en:trozo,es:r?r.es:"",pr:r?r.pr:""};

function ingles(texto,opts={}){
  const A=S.ayudas, f=opts.partes?fichasDe(opts.partes):fichas(texto,opts.palabras);
  const tam=opts.tam||"md", soloIngles=!!opts.soloIngles;

      h("b",{},x.en),
      A.pron?h("span",{class:"pr"},x.pr||" "):null,
      h("span",{class:"gl"},x.es||" ")))));

    cuerpo.append(h("div",{class:"en-line",lang:"en"},texto));

let cola=null, volteada=false, tResp=null;
const sinTildes=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function tokensEn(x){return variantes(x)[0].split(" ").filter(Boolean)}
function tokensEs(x){return sinTildes(x).replace(/[^a-zñ ]+/g," ").split(/\s+/).filter(Boolean)}
/* Compara palabra por palabra (LCS) y marca cuáles coinciden */
function compararPalabras(dada,correcta){
  const a=tokensEn(dada), b=tokensEn(correcta);
  const dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const okA=new Set(),okB=new Set(); let i=0,j=0;
  while(i<a.length&&j<b.length){ if(a[i]===b[j]){okA.add(i);okB.add(j);i++;j++} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  const puntaje=b.length?dp[0][0]/Math.max(b.length,a.length):0;
  return {a,b,okA,okB,puntaje};
}
function parecidoEs(dada,correcta){
  const vacias=new Set(["el","la","los","las","un","una","de","a","y","que","en","me","te","se","lo","le","por","con","es","yo","tu","mi"]);
  const a=new Set(tokensEs(dada)), b=tokensEs(correcta);
  const imp=b.filter(w=>!vacias.has(w)); const base=imp.length?imp:b;
  if(!base.length) return 0;
  return base.filter(w=>a.has(w)).length/base.length;
}
function revisarTarjeta(c,en,es){
  const r={en:String(en||"").trim(),es:String(es||"").trim(),cmp:null,pEs:null};
  if(r.en) r.cmp=compararPalabras(r.en,c.en);
  if(r.es&&c.es) r.pEs=parecidoEs(r.es,c.es);
  const notas=[]; if(r.cmp) notas.push(r.cmp.puntaje); if(r.pEs!=null) notas.push(r.pEs>=0.6?1:r.pEs);
  r.prom=notas.length?notas.reduce((x,y)=>x+y,0)/notas.length:null;
  r.sugerida=r.prom==null?null:r.prom>=0.95?2:r.prom>=0.6?1:0;
  return r;
}

function pintarPreg(){

  }

    const ej=Array.isArray(r.ejemplos)?r.ejemplos.filter(e=>e&&e.en):[];

    chat.append(m);

async function preguntar(txt){
  txt=String(txt||"").trim(); if(!txt||pregCurso||!sample) return;
  S.preg.push({role:"user",content:txt}); const ta=$("#preg-entrada"); if(ta) ta.value="";
  pregCurso=new AbortController(); pintarPreg();
  const msgs=[{role:"user",content:reglasPreg()}];
  for(const t of S.preg.slice(-16)) msgs.push({role:t.role,content:t.role==="assistant"?JSON.stringify(t.data):t.content});
  try{
    const r=await sample.json(msgs,{cache:false,signal:pregCurso.signal});
    if(!r||typeof r.respuesta!=="string") throw {code:"bad"};
    for(const e of r.ejemplos||[]) if(e) aprenderPalabras(e.palabras);
    S.preg.push({role:"assistant",content:r.respuesta,data:r});
    if(S.preg.length>40) S.preg=S.preg.slice(-40);
    guardar();
  }catch(e){
    S.preg.pop(); if(ta) ta.value=txt;
    const m=mensajeError(e); if(m) toast(m);
  }finally{
    pregCurso=null; pintarPreg();
    const c=$("#preg-chat"); if(c&&c.lastElementChild) c.lastElementChild.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}

function frasesDeClase(d){

async function crearClase(tema){

/* ---------- PLAN ---------- */
function vPlan(){
  const sem=semana();
  return h("section",{class:"view"},
    titulo(`Empezaste el ${new Date(S.inicio+"T12:00:00").toLocaleDateString("es-DO",{day:"numeric",month:"long",year:"numeric"})}`,"Plan de 24 semanas"),
    h("div",{class:"panel"},
      h("span",{class:"eyebrow"},"Rutina diaria · 1 hora"),
      h("div",{class:"rutina"},
        h("div",{},h("b",{},"15 min"),h("span",{},"Tarjetas y verbos: repasa lo pendiente y conjuga 10 verbos")),
        h("div",{},h("b",{},"20 min"),h("span",{},"Tutor: una situación, mínimo 10 respuestas")),
        h("div",{},h("b",{},"10 min"),h("span",{},"Shadowing: 15 repeticiones en voz alta")),
        h("div",{},h("b",{},"15 min"),h("span",{},"Voz con Claude: hablar sin parar")))),
    h("div",{class:"panel"},FASES.map(f=>h("div",{class:"fase"+(sem>=f.a&&sem<=f.b?" actual":"")},
      h("div",{class:"sem tabnum"},`Sem ${f.a}–${f.b}`),
      h("div",{},h("h3",{},f.t+(sem>=f.a&&sem<=f.b?" · ahora":"")),h("ul",{},f.o.map(x=>h("li",{},x))))))),
    h("div",{class:"tip"},"Si un día no puedes hacer la hora completa, haz al menos tarjetas y shadowing. Lo importante es no romper la racha.")
  );
}

/* ---------- Paletas de color ---------- */
const OSC={ok:"#6CC28A",warn:"#E2AE4C"}, CLA={ok:"#2F7D46",warn:"#B9771A"};
const TEMAS=[
 {id:"auto",g:"Básicas",n:"Automático",sw:["#F6F0E4","#B4362A","#17141F"]},
 {id:"sello",g:"Básicas",n:"Sello Amauta",dark:1,v:{bg:"#111827",surface:"#18223A",soft:"#222E4A",line:"#2F3C5C",ink:"#F1E6D2",muted:"#A9A08C",accent:"#C8925A","accent-ink":"#140E07",teal:"#7DB9B3",gold:"#D9B26A"}},
 {id:"crema",g:"Básicas",n:"Crema",v:{bg:"#F6F0E4",surface:"#FFFBF3",soft:"#EFE5D2",line:"#E2D8C6",ink:"#1F1B2E",muted:"#6B6378",accent:"#B4362A","accent-ink":"#FFFFFF",teal:"#1F6E6A",gold:"#C98A1B"}},
 {id:"noche",g:"Básicas",n:"Noche",dark:1,v:{bg:"#17141F",surface:"#211D2B",soft:"#2A2536",line:"#36304A",ink:"#F2EBDD",muted:"#A79FB3",accent:"#E0654F","accent-ink":"#1A0F0C",teal:"#5BB8B0",gold:"#E2AE4C"}},
 {id:"grafito",g:"Sobrias",n:"Grafito y oro",dark:1,v:{bg:"#121417",surface:"#1B1E23",soft:"#272B31",line:"#30353C",ink:"#ECE8DF",muted:"#8F949B",accent:"#C9A96E","accent-ink":"#14161A",teal:"#7FA38C",gold:"#E3D3A8"}},
 {id:"vino",g:"Sobrias",n:"Vino tinto",dark:1,v:{bg:"#1A1012",surface:"#251719",soft:"#362224",line:"#43292C",ink:"#F2E7DE",muted:"#A8918A",accent:"#C94B5E","accent-ink":"#FFFFFF",teal:"#9AAB7C",gold:"#C49A5B"}},
 {id:"pizarra",g:"Sobrias",n:"Pizarra",v:{bg:"#ECEFF2",surface:"#F9FAFB",soft:"#DBE1E7",line:"#CDD5DE",ink:"#1F2933",muted:"#5F6B78",accent:"#2F4A63","accent-ink":"#FFFFFF",teal:"#4F7461",gold:"#A3503A"}},
 {id:"lofi",g:"Chill",n:"Lo-fi",dark:1,v:{bg:"#1E1B2E",surface:"#28243B",soft:"#353050",line:"#3E385B",ink:"#ECE6F5",muted:"#9B93B6",accent:"#A493FF","accent-ink":"#1E1B2E",teal:"#7FD1C7",gold:"#F5E17A"}},
 {id:"atardecer",g:"Chill",n:"Atardecer",v:{bg:"#FDF0EA",surface:"#FFFAF7",soft:"#F5DCD1",line:"#EBCFC2",ink:"#3D2C33",muted:"#7D656C",accent:"#C2594C","accent-ink":"#FFFFFF",teal:"#6E5AA8",gold:"#D99A3C"}},
 {id:"oceano",g:"Chill",n:"Océano",dark:1,v:{bg:"#0F2027",surface:"#16303A",soft:"#1F404C",line:"#28505E",ink:"#E3F2F1",muted:"#86AEB0",accent:"#5CC8B5","accent-ink":"#0F2027",teal:"#8FC9EA",gold:"#F2A65A"}},
 {id:"matcha",g:"Chill",n:"Matcha",v:{bg:"#EFF3E9",surface:"#FBFCF8",soft:"#DCE5D0",line:"#CFDAC0",ink:"#2B3326",muted:"#6D7B62",accent:"#5F8A4E","accent-ink":"#FFFFFF",teal:"#4E7A6C",gold:"#C4775E"}},
];
const VARS=["bg","surface","soft","line","ink","muted","accent","accent-ink","teal","gold","ok","warn"];
function aplicarTema(id){
  const t=TEMAS.find(x=>x.id===id)||TEMAS[0]; const r=document.documentElement;
  for(const k of VARS) r.style.removeProperty("--"+k);
  r.style.removeProperty("color-scheme");
  if(t.v){ const v={...t.v,...(t.dark?OSC:CLA)}; for(const k of VARS) r.style.setProperty("--"+k,v[k]); r.style.colorScheme=t.dark?"dark":"light"; }
}

/* ---------- AJUSTES ---------- */
const AYUDAS=[
  {k:"palabra",t:"Traducción palabra por palabra",d:"Debajo de cada palabra en inglés aparece lo que significa."},
  {k:"trad",t:"Traducción completa",d:"La frase entera traducida al español, como se diría normal."},
  {k:"pron",t:"Pronunciación escrita",d:"Cómo suena cada palabra escrita con letras en español, por ejemplo hello = jelóu."}];
function pintarAjustes(){
  const box=$("#ajustes"); const actual=S.tema||"auto";
  const ejemplo=h("div",{class:"ejemplo-ajustes"},ingles("Nice to meet you.",{es:"Mucho gusto.",oir:false}));
  box.replaceChildren(
    h("div",{class:"fila-sb"},h("h2",{style:"font-size:22px"},"Ajustes"),
      h("button",{class:"btn ghost",type:"button",style:"padding:5px 14px;font-size:14px",onclick:()=>abrirAjustes(false)},"Listo")),
    h("span",{class:"eyebrow"},"Ayudas para leer inglés"),
    h("div",{class:"switches"},AYUDAS.map(a=>{
      const id="aj-"+a.k;
      const input=h("input",{type:"checkbox",role:"switch",id,checked:!!S.ayudas[a.k]});
      input.addEventListener("change",()=>{S.ayudas[a.k]=input.checked;guardar();pintarAjustes();render()});
      return h("label",{class:"sw",for:id},h("span",{},h("b",{},a.t),h("span",{class:"small muted"},a.d)),input);
    })),
    h("div",{class:"small muted"},"Así se ve con lo que tienes activado:"),
    ejemplo,
    h("span",{class:"eyebrow"},"Paleta de colores"),
    ...["Básicas","Sobrias","Chill"].map(g=>h("div",{class:"temas-grupo"},h("div",{class:"small muted"},g),
      h("div",{class:"temas-grid"},TEMAS.filter(t=>t.g===g).map(t=>{
        const sw=t.sw||[t.v.bg,t.v.accent,t.v.teal];
        return h("button",{class:"tema-op",type:"button","aria-pressed":actual===t.id?"true":"false",onclick:()=>{S.tema=t.id;aplicarTema(t.id);guardar();pintarAjustes()}},
          h("span",{},t.n),h("span",{class:"swatches","aria-hidden":"true"},sw.map(c=>h("i",{style:`background:${c}`}))));
      })))),
    h("div",{class:"small muted"},"Automático usa Crema de día y Noche cuando tu teléfono está en modo oscuro."));
}
function abrirAjustes(abrir){const box=$("#ajustes"),b=$("#ajustes-btn");box.hidden=!abrir;b.setAttribute("aria-expanded",abrir?"true":"false");if(abrir){pintarAjustes();window.scrollTo({top:0,behavior:"smooth"})}}

/* ---------- Arranque ---------- */
S=norm(lsGet()); aplicarTema(S.tema||"auto"); pintarTabs(); render();
$("#ajustes-btn").addEventListener("click",()=>abrirAjustes($("#ajustes").hidden));
$("#preguntar-btn").addEventListener("click",()=>{abrirAjustes(false);ir("preguntar")});

(async()=>{
  try{
    const c=window.claude; if(!c||!c.use)return;
    const [db,user,smp]=await Promise.all([c.use("db"),c.use("user"),c.use("sample")]);
    sample=smp||null;
    if(db&&user){
      const id=await user.id();
      if(id){
        dbRef=db.collection("data/users/"+id).doc("amauta");
        const snap=await dbRef.get().catch(()=>null);
        const remoto=snap&&snap.exists?norm(snap.data()):null;
        const local=lsGet();
        S=norm(mezclar(local?norm(local):null,remoto)||S); cola=null;
        aplicarTema(S.tema||"auto"); guardar();
      }
    }
  }catch(e){}
  render();
})();
})();

</script>
